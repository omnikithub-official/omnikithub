<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dictionary & Definition Finder - OmniKitHub</title>
    <meta name="description" content="Free online English dictionary with meanings, audio pronunciation, phonetics, synonyms, antonyms, and example sentences.">
    <meta name="keywords" content="online dictionary, word meaning finder, audio pronunciation, English dictionary, synonyms finder, antonyms online">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1.1rem;
            outline: none;
            transition: border-color var(--transition-speed) ease;
        }

        .search-input:focus { border-color: var(--accent-color); }

        .action-btn {
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            transition: background var(--transition-speed) ease;
        }

        .action-btn:hover { background: var(--accent-hover); }

        .result-box {
            display: none;
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }

        .result-box.active { display: block; }

        .word-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .audio-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .audio-btn:hover { transform: scale(1.08); }

        .meaning-section {
            margin-bottom: 20px;
        }

        .pos-badge {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: italic;
        }

        .definition-item {
            margin-bottom: 12px;
            padding-left: 15px;
            border-left: 3px solid var(--accent-color);
        }

        .example-text {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag-item {
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Online Dictionary & Definition Finder</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Search any word to get definitions, phonetics, audio pronunciation, synonyms, and antonyms.</p>

            <div class="search-box">
                <input type="text" id="word-input" class="search-input" placeholder="Enter a word (e.g., knowledge, innovation)..." autofocus>
                <button id="search-btn" class="action-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>

            <!-- Result Box -->
            <div id="result-box" class="result-box">
                <div class="word-header">
                    <div>
                        <h2 id="res-word" style="font-size: 2rem; color: var(--text-primary); text-transform: capitalize;">Word</h2>
                        <span id="res-phonetic" style="color: var(--accent-color); font-weight: 600;">/phonetic/</span>
                    </div>
                    <button id="audio-btn" class="audio-btn" title="Listen Pronunciation">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>

                <div id="meanings-container"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        const wordInput = document.getElementById('word-input');
        const searchBtn = document.getElementById('search-btn');
        const resultBox = document.getElementById('result-box');
        const resWord = document.getElementById('res-word');
        const resPhonetic = document.getElementById('res-phonetic');
        const audioBtn = document.getElementById('audio-btn');
        const meaningsContainer = document.getElementById('meanings-container');

        let audioUrl = '';

        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchWord();
        });

        searchBtn.addEventListener('click', searchWord);

        function searchWord() {
            const word = wordInput.value.trim();
            if (!word) return;

            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Finding...';

            fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`)
                .then(res => {
                    if (!res.ok) throw new Error('Word not found');
                    return res.json();
                })
                .then(data => {
                    renderResult(data[0]);
                    searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search';
                })
                .catch(err => {
                    alert('Word not found! Please check spelling and try again.');
                    resultBox.classList.remove('active');
                    searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search';
                });
        }

        function renderResult(data) {
            resWord.innerText = data.word;
            resPhonetic.innerText = data.phonetic || (data.phonetics.find(p => p.text)?.text || '');

            // Audio track finder
            const audioObj = data.phonetics.find(p => p.audio && p.audio.length > 0);
            audioUrl = audioObj ? audioObj.audio : '';
            audioBtn.style.display = audioUrl ? 'flex' : 'none';

            meaningsContainer.innerHTML = '';

            data.meanings.forEach(meaning => {
                const section = document.createElement('div');
                section.className = 'meaning-section';

                let defsHtml = '';
                meaning.definitions.slice(0, 3).forEach((def, index) => {
                    defsHtml += `
                        <div class="definition-item">
                            <div><strong>${index + 1}.</strong> ${def.definition}</div>
                            ${def.example ? `<div class="example-text">"${def.example}"</div>` : ''}
                        </div>
                    `;
                });

                let synonymsHtml = '';
                if (meaning.synonyms && meaning.synonyms.length > 0) {
                    synonymsHtml = `
                        <div style="margin-top: 10px;">
                            <strong style="font-size: 0.85rem; color: var(--text-secondary);">Synonyms:</strong>
                            <div class="tag-list">
                                ${meaning.synonyms.slice(0, 6).map(s => `<span class="tag-item">${s}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }

                section.innerHTML = `
                    <span class="pos-badge">${meaning.partOfSpeech}</span>
                    ${defsHtml}
                    ${synonymsHtml}
                `;

                meaningsContainer.appendChild(section);
            });

            resultBox.classList.add('active');
        }

        audioBtn.addEventListener('click', () => {
            if (audioUrl) {
                const audio = new Audio(audioUrl);
                audio.play();
            }
        });
    </script>
</body>
</html>
