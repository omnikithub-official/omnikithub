<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover - OmniKitHub</title>
    <meta name="description" content="Remove image background online for free. Convert photo background to transparent PNG or replace with custom solid colors instantly.">
    <meta name="keywords" content="background remover online, remove bg free, transparent png maker, change photo background, photo cutout tool">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-container {
            max-width: 1100px;
            margin: 40px auto;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .upload-area {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            background: var(--bg-primary);
            cursor: pointer;
            transition: background var(--transition-speed) ease;
            margin-bottom: 25px;
        }

        .upload-area:hover { background: var(--badge-bg); }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg-surface);
            color: var(--text-primary);
            outline: none;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .preview-card {
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .canvas-container {
            width: 100%;
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        canvas, img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background var(--transition-speed) ease;
        }

        .action-btn:hover { background: var(--accent-hover); }

        @media (max-width: 768px) {
            .preview-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Background Remover</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Remove background from photos automatically or replace with custom backdrop colors.</p>

            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-wand-magic-sparkles" style="font-size: 2.5rem; color: var(--accent-color); margin-bottom: 10px;"></i>
                <div style="font-weight: 700; font-size: 1.1rem; color: var(--text-primary);">Upload Photo to Remove Background</div>
                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">Supports JPG, PNG, WebP</div>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
            </div>

            <div class="controls-grid">
                <div class="form-group">
                    <label>Color Sensitivity / Tolerance: <span id="tol-val">30</span></label>
                    <input type="range" id="tolerance-slider" min="5" max="100" value="30" style="width: 100%;">
                </div>

                <div class="form-group">
                    <label>Replace Background Color:</label>
                    <select id="bg-color-select" class="form-control">
                        <option value="transparent">Transparent (PNG)</option>
                        <option value="#ffffff">Pure White</option>
                        <option value="#000000">Pure Black</option>
                        <option value="#3b82f6">Royal Blue</option>
                        <option value="#10b981">Studio Green</option>
                    </select>
                </div>
            </div>

            <div class="preview-grid">
                <div class="preview-card">
                    <h4 style="margin-bottom: 12px; color: var(--text-primary);">Original Photo</h4>
                    <div style="min-height: 260px; display: flex; align-items: center; justify-content: center;">
                        <img id="orig-preview" alt="Original Image" style="display: none;">
                        <span id="orig-placeholder" style="color: var(--text-secondary); font-size: 0.9rem;">No image uploaded</span>
                    </div>
                </div>

                <div class="preview-card">
                    <h4 style="margin-bottom: 12px; color: var(--text-primary);">Background Removed Output</h4>
                    <div class="canvas-container">
                        <canvas id="out-canvas"></canvas>
                    </div>
                </div>
            </div>

            <button id="download-btn" class="action-btn"><i class="fa-solid fa-download"></i> Download Processed PNG Image</button>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        const fileInput = document.getElementById('file-input');
        const origPreview = document.getElementById('orig-preview');
        const origPlaceholder = document.getElementById('orig-placeholder');
        const outCanvas = document.getElementById('out-canvas');
        const ctx = outCanvas.getContext('2d');
        const toleranceSlider = document.getElementById('tolerance-slider');
        const tolVal = document.getElementById('tol-val');
        const bgColorSelect = document.getElementById('bg-color-select');
        const downloadBtn = document.getElementById('download-btn');

        let loadedImage = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                loadedImage = new Image();
                loadedImage.onload = () => {
                    origPreview.src = event.target.result;
                    origPreview.style.display = 'block';
                    origPlaceholder.style.display = 'none';
                    processBackgroundRemoval();
                };
                loadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        toleranceSlider.addEventListener('input', () => {
            tolVal.innerText = toleranceSlider.value;
            if (loadedImage) processBackgroundRemoval();
        });

        bgColorSelect.addEventListener('change', () => {
            if (loadedImage) processBackgroundRemoval();
        });

        function processBackgroundRemoval() {
            if (!loadedImage) return;

            const w = loadedImage.width;
            const h = loadedImage.height;

            outCanvas.width = w;
            outCanvas.height = h;

            ctx.clearRect(0, 0, w, h);

            // Fill replacement background if not transparent
            const selectedBg = bgColorSelect.value;
            if (selectedBg !== 'transparent') {
                ctx.fillStyle = selectedBg;
                ctx.fillRect(0, 0, w, h);
            }

            // Temp canvas for pixel processing
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(loadedImage, 0, 0);

            const imgData = tempCtx.getImageData(0, 0, w, h);
            const data = imgData.data;

            // Sample top-left corner color as primary background reference
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];

            const tolerance = parseInt(toleranceSlider.value) * 2.5;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const diff = Math.sqrt(
                    (r - bgR) * (r - bgR) +
                    (g - bgG) * (g - bgG) +
                    (b - bgB) * (b - bgB)
                );

                if (diff < tolerance) {
                    data[i + 3] = 0; // Make pixel transparent
                }
            }

            tempCtx.putImageData(imgData, 0, 0);
            ctx.drawImage(tempCanvas, 0, 0);
        }

        downloadBtn.addEventListener('click', () => {
            if (!loadedImage) {
                alert('Please upload a photo first!');
                return;
            }
            const link = document.createElement('a');
            link.download = 'OmniKitHub-Background-Removed.png';
            link.href = outCanvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
