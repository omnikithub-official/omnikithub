<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Resizer & Signature Crop - OmniKitHub</title>
    <meta name="description" content="Resize and crop photos or signatures to exact pixels (300x300, 300x80) and KB size for job applications and official forms online for free.">
    <meta name="keywords" content="photo resizer online, signature crop tool, 300x300 photo converter, 300x80 signature resizer, image kb reducer">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-container {
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .panel-box {
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
        }

        .upload-area {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            background: var(--bg-primary);
            cursor: pointer;
            transition: background var(--transition-speed) ease;
            margin-bottom: 20px;
        }

        .upload-area:hover { background: var(--badge-bg); }

        .preset-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .preset-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
        }

        .preset-btn:hover, .preset-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
        }

        .preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        canvas {
            max-width: 100%;
            max-height: 320px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .info-badge {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background var(--transition-speed) ease;
        }

        .action-btn:hover { background: var(--accent-hover); }

        @media (max-width: 900px) {
            .tool-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <!-- Left Controls -->
            <div class="panel-box">
                <h1 style="font-size: 1.5rem; margin-bottom: 6px;">Photo Resizer & Signature Crop</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 18px;">Resize images to exact dimensions (Pixels/mm) and compress file size in KB for job forms.</p>

                <div class="upload-area" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2rem; color: var(--accent-color); margin-bottom: 8px;"></i>
                    <div style="font-weight: 600; color: var(--text-primary);">Click or Drag Image Here</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Supports JPG, PNG, WebP</div>
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                </div>

                <div style="font-weight: 600; font-size: 0.85rem; margin-bottom: 8px;">Quick Presets:</div>
                <div class="preset-btns">
                    <button class="preset-btn" onclick="applyPreset(300, 300)">Photo (300x300)</button>
                    <button class="preset-btn" onclick="applyPreset(300, 80)">Signature (300x80)</button>
                    <button class="preset-btn" onclick="applyPreset(600, 600)">Passport (600x600)</button>
                </div>

                <div class="input-row">
                    <div class="form-group">
                        <label>Width (Pixels):</label>
                        <input type="number" id="img-width" class="form-control" value="300">
                    </div>
                    <div class="form-group">
                        <label>Height (Pixels):</label>
                        <input type="number" id="img-height" class="form-control" value="300">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Quality & Compression Quality: <span id="quality-val">90%</span></label>
                    <input type="range" id="img-quality" min="10" max="100" value="90" style="width: 100%;">
                </div>
            </div>

            <!-- Right Preview & Download -->
            <div class="panel-box" style="display: flex; flex-direction: column;">
                <h3 style="font-size: 1.1rem; margin-bottom: 15px;">Live Resized Preview</h3>
                
                <div class="preview-box">
                    <canvas id="canvas-preview"></canvas>
                    <div id="file-info" class="info-badge">Upload an image to preview</div>
                </div>

                <button id="download-btn" class="action-btn"><i class="fa-solid fa-download"></i> Download Resized Image</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        const fileInput = document.getElementById('file-input');
        const imgWidth = document.getElementById('img-width');
        const imgHeight = document.getElementById('img-height');
        const imgQuality = document.getElementById('img-quality');
        const qualityVal = document.getElementById('quality-val');
        const canvas = document.getElementById('canvas-preview');
        const ctx = canvas.getContext('2d');
        const fileInfo = document.getElementById('file-info');
        const downloadBtn = document.getElementById('download-btn');

        let loadedImage = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                loadedImage = new Image();
                loadedImage.onload = () => {
                    renderCanvas();
                };
                loadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function applyPreset(w, h) {
            imgWidth.value = w;
            imgHeight.value = h;
            renderCanvas();
        }

        imgWidth.addEventListener('input', renderCanvas);
        imgHeight.addEventListener('input', renderCanvas);
        imgQuality.addEventListener('input', () => {
            qualityVal.innerText = `${imgQuality.value}%`;
            renderCanvas();
        });

        function renderCanvas() {
            if (!loadedImage) return;

            const w = parseInt(imgWidth.value) || 300;
            const h = parseInt(imgHeight.value) || 300;

            canvas.width = w;
            canvas.height = h;

            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(loadedImage, 0, 0, w, h);

            const quality = parseFloat(imgQuality.value) / 100;
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const head = 'data:image/jpeg;base64,';
            const sizeInBytes = Math.round((dataUrl.length - head.length) * 3 / 4);
            const sizeInKB = (sizeInBytes / 1024).toFixed(2);

            fileInfo.innerText = `Dimensions: ${w} x ${h} px | Est. Size: ${sizeInKB} KB`;
        }

        downloadBtn.addEventListener('click', () => {
            if (!loadedImage) {
                alert('Please upload an image first!');
                return;
            }
            const quality = parseFloat(imgQuality.value) / 100;
            const link = document.createElement('a');
            link.download = 'OmniKitHub-Resized.jpg';
            link.href = canvas.toDataURL('image/jpeg', quality);
            link.click();
        });
    </script>
</body>
</html>
