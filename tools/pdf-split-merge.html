<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Split & Merge Utility - OmniKitHub</title>
    <meta name="description" content="Combine multiple PDF files into one or split PDF pages easily online for free with OmniKitHub PDF Utility tool.">
    <meta name="keywords" content="pdf merger, pdf splitter, combine pdf files online, split pdf pages free, merge pdf documents">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- pdf-lib Library for Client-side PDF Manipulation -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        .tool-container {
            max-width: 950px;
            margin: 40px auto;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .upload-area {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: var(--bg-primary);
            cursor: pointer;
            transition: background var(--transition-speed) ease;
            margin-bottom: 25px;
        }

        .upload-area:hover { background: var(--badge-bg); }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .file-item {
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .remove-icon {
            color: #ef4444;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }

        .remove-icon:hover { transform: scale(1.15); }

        .split-controls {
            display: none;
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg-surface);
            color: var(--text-primary);
            outline: none;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background var(--transition-speed) ease;
        }

        .action-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">PDF Split & Merge Utility</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Combine multiple PDFs into a single file or extract specific pages from a PDF document.</p>

            <!-- Mode Selector -->
            <div class="mode-selector">
                <button id="mode-merge-btn" class="mode-btn active" onclick="switchMode('merge')">
                    <i class="fa-solid fa-code-merge"></i> Merge PDFs
                </button>
                <button id="mode-split-btn" class="mode-btn" onclick="switchMode('split')">
                    <i class="fa-solid fa-scissors"></i> Split / Extract PDF
                </button>
            </div>

            <!-- Drag & Drop Area -->
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-file-pdf" style="font-size: 2.5rem; color: var(--accent-color); margin-bottom: 10px;"></i>
                <div id="upload-title" style="font-weight: 700; font-size: 1.1rem; color: var(--text-primary);">Upload PDF Files to Merge</div>
                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">Click or Drag PDF files here</div>
                <input type="file" id="file-input" accept="application/pdf" multiple style="display: none;">
            </div>

            <!-- File List -->
            <div id="file-list" class="file-list"></div>

            <!-- Split Controls -->
            <div id="split-box" class="split-controls">
                <div class="form-group">
                    <label>Enter Page Numbers / Ranges (e.g., 1-3, 5, 8):</label>
                    <input type="text" id="split-range" class="form-control" placeholder="e.g., 1-2, 4">
                </div>
            </div>

            <button id="process-btn" class="action-btn"><i class="fa-solid fa-gear"></i> Process PDF File(s)</button>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        let activeMode = 'merge';
        let pdfFiles = [];

        const fileInput = document.getElementById('file-input');
        const fileListEl = document.getElementById('file-list');
        const splitBox = document.getElementById('split-box');
        const uploadTitle = document.getElementById('upload-title');
        const processBtn = document.getElementById('process-btn');

        function switchMode(mode) {
            activeMode = mode;
            pdfFiles = [];
            renderFileList();

            if (mode === 'merge') {
                document.getElementById('mode-merge-btn').classList.add('active');
                document.getElementById('mode-split-btn').classList.remove('active');
                uploadTitle.innerText = 'Upload PDF Files to Merge';
                fileInput.multiple = true;
                splitBox.style.display = 'none';
            } else {
                document.getElementById('mode-split-btn').classList.add('active');
                document.getElementById('mode-merge-btn').classList.remove('active');
                uploadTitle.innerText = 'Upload a Single PDF File to Split';
                fileInput.multiple = false;
                splitBox.style.display = 'block';
            }
        }

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (let f of files) {
                const arrayBuffer = await f.arrayBuffer();
                pdfFiles.push({ name: f.name, size: (f.size / 1024).toFixed(1) + ' KB', buffer: arrayBuffer });
            }
            renderFileList();
            fileInput.value = '';
        });

        function renderFileList() {
            fileListEl.innerHTML = '';
            pdfFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <i class="fa-solid fa-file-pdf" style="color: var(--accent-color);"></i>
                        <span>${file.name} (${file.size})</span>
                    </div>
                    <i class="fa-solid fa-trash remove-icon" onclick="removeFile(${index})"></i>
                `;
                fileListEl.appendChild(item);
            });
        }

        window.removeFile = function(index) {
            pdfFiles.splice(index, 1);
            renderFileList();
        };

        processBtn.addEventListener('click', async () => {
            if (pdfFiles.length === 0) {
                alert('Please upload PDF file(s) first!');
                return;
            }

            processBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

            try {
                if (activeMode === 'merge') {
                    if (pdfFiles.length < 2) {
                        alert('Please upload at least 2 PDF files to merge.');
                        processBtn.innerHTML = '<i class="fa-solid fa-gear"></i> Process PDF File(s)';
                        return;
                    }
                    const mergedPdf = await PDFLib.PDFDocument.create();

                    for (let file of pdfFiles) {
                        const pdf = await PDFLib.PDFDocument.load(file.buffer);
                        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                        copiedPages.forEach((page) => mergedPdf.addPage(page));
                    }

                    const pdfBytes = await mergedPdf.save();
                    downloadBlob(pdfBytes, 'OmniKitHub-Merged.pdf');
                } else {
                    const rangeVal = document.getElementById('split-range').value.trim();
                    if (!rangeVal) {
                        alert('Please enter a valid page range (e.g., 1-2, 4).');
                        processBtn.innerHTML = '<i class="fa-solid fa-gear"></i> Process PDF File(s)';
                        return;
                    }

                    const originalPdf = await PDFLib.PDFDocument.load(pdfFiles[0].buffer);
                    const newPdf = await PDFLib.PDFDocument.create();
                    const totalPages = originalPdf.getPageCount();

                    const pageIndices = parsePageRange(rangeVal, totalPages);
                    if (pageIndices.length === 0) {
                        alert('Invalid page numbers specified.');
                        processBtn.innerHTML = '<i class="fa-solid fa-gear"></i> Process PDF File(s)';
                        return;
                    }

                    const copiedPages = await newPdf.copyPages(originalPdf, pageIndices);
                    copiedPages.forEach((page) => newPdf.addPage(page));

                    const pdfBytes = await newPdf.save();
                    downloadBlob(pdfBytes, 'OmniKitHub-Split.pdf');
                }
            } catch (err) {
                alert('An error occurred while processing PDF. Please ensure the files are valid.');
            }

            processBtn.innerHTML = '<i class="fa-solid fa-gear"></i> Process PDF File(s)';
        });

        function parsePageRange(rangeStr, totalPages) {
            const indices = [];
            const parts = rangeStr.split(',');

            parts.forEach(part => {
                const range = part.trim().split('-');
                if (range.length === 2) {
                    const start = parseInt(range[0]) - 1;
                    const end = parseInt(range[1]) - 1;
                    for (let i = start; i <= end; i++) {
                        if (i >= 0 && i < totalPages && !indices.includes(i)) indices.push(i);
                    }
                } else if (range.length === 1) {
                    const p = parseInt(range[0]) - 1;
                    if (p >= 0 && p < totalPages && !indices.includes(p)) indices.push(p);
                }
            });

            return indices;
        }

        function downloadBlob(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
    </script>
</body>
</html>
