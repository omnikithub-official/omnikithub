<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome & Beat Counter - OmniKitHub</title>
    <meta name="description" content="Free online metronome with tap tempo, customizable BPM, and visual beat counter for guitar, piano, and music practice.">
    <meta name="keywords" content="metronome online, free online metronome, tap tempo tool, bpm counter, music beat timer, practice metronome">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-container {
            max-width: 850px;
            margin: 40px auto;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .metronome-box {
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 35px 20px;
            margin-bottom: 25px;
        }

        .bpm-display {
            font-size: 3.8rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 10px 0;
            line-height: 1;
        }

        .bpm-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .bpm-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .bpm-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed) ease;
        }

        .bpm-btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .slider-box {
            max-width: 400px;
            margin: 0 auto 25px auto;
        }

        .beat-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }

        .beat-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--card-border);
            transition: all 0.1s ease;
        }

        .beat-dot.active {
            background: var(--accent-color);
            transform: scale(1.3);
            box-shadow: 0 0 12px var(--accent-color);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            max-width: 450px;
            margin: 0 auto 25px auto;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg-surface);
            color: var(--text-primary);
            outline: none;
            font-size: 0.95rem;
            text-align: center;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 14px 32px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-speed) ease;
        }

        .btn-start { background: var(--accent-color); color: #fff; }
        .btn-start:hover { background: var(--accent-hover); }
        .btn-tap { background: var(--badge-bg); color: var(--text-primary); border: 1px solid var(--card-border); }
        .btn-tap:hover { background: var(--card-border); }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Metronome & Beat Counter</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Interactive metronome with tap tempo and custom beat indicators for music practice.</p>

            <div class="metronome-box">
                <div id="bpm-val" class="bpm-display">120</div>
                <div class="bpm-label">Beats Per Minute (BPM)</div>

                <div class="bpm-controls">
                    <button class="bpm-btn" onclick="adjustBpm(-5)">-5</button>
                    <button class="bpm-btn" onclick="adjustBpm(-1)">-1</button>
                    <button class="bpm-btn" onclick="adjustBpm(1)">+1</button>
                    <button class="bpm-btn" onclick="adjustBpm(5)">+5</button>
                </div>

                <div class="slider-box">
                    <input type="range" id="bpm-slider" min="30" max="250" value="120" style="width: 100%; cursor: pointer;">
                </div>

                <div id="beat-dots" class="beat-indicators">
                    <!-- Dots generated dynamically based on time signature -->
                </div>

                <div class="controls-grid">
                    <div class="form-group">
                        <label>Beats Per Measure:</label>
                        <select id="time-signature" class="form-control" onchange="setupDots()">
                            <option value="2">2 Beats (2/4)</option>
                            <option value="3">3 Beats (3/4)</option>
                            <option value="4" selected>4 Beats (4/4)</option>
                            <option value="6">6 Beats (6/8)</option>
                        </select>
                    </div>
                </div>

                <div class="btn-group">
                    <button id="start-btn" class="action-btn btn-start" onclick="toggleMetronome()"><i class="fa-solid fa-play"></i> Start Metronome</button>
                    <button class="action-btn btn-tap" onclick="handleTapTempo()"><i class="fa-solid fa-hand-pointer"></i> Tap Tempo</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        let isPlaying = false;
        let bpm = 120;
        let timerId = null;
        let currentBeat = 0;
        let tapTimes = [];

        // Web Audio API for synthetic click sounds (zero external file dependency)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const bpmDisplay = document.getElementById('bpm-val');
        const bpmSlider = document.getElementById('bpm-slider');
        const startBtn = document.getElementById('start-btn');
        const beatDotsContainer = document.getElementById('beat-dots');
        const timeSignatureSelect = document.getElementById('time-signature');

        function setupDots() {
            const count = parseInt(timeSignatureSelect.value);
            beatDotsContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'beat-dot';
                beatDotsContainer.appendChild(dot);
            }
            currentBeat = 0;
        }

        function adjustBpm(val) {
            bpm = Math.min(250, Math.max(30, bpm + val));
            updateBpmUI();
        }

        bpmSlider.addEventListener('input', () => {
            bpm = parseInt(bpmSlider.value);
            updateBpmUI();
        });

        function updateBpmUI() {
            bpmDisplay.innerText = bpm;
            bpmSlider.value = bpm;
            if (isPlaying) {
                restartMetronome();
            }
        }

        function playClick(isAccent) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.value = isAccent ? 1000 : 600; // Higher pitch on beat 1

            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function tick() {
            const beats = parseInt(timeSignatureSelect.value);
            const dots = beatDotsContainer.children;

            for (let i = 0; i < dots.length; i++) {
                dots[i].classList.remove('active');
            }

            if (dots[currentBeat]) {
                dots[currentBeat].classList.add('active');
            }

            playClick(currentBeat === 0);

            currentBeat = (currentBeat + 1) % beats;
        }

        function toggleMetronome() {
            if (isPlaying) {
                stopMetronome();
            } else {
                startMetronome();
            }
        }

        function startMetronome() {
            isPlaying = true;
            currentBeat = 0;
            startBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause Metronome';
            startBtn.style.background = '#ef4444';
            tick();
            timerId = setInterval(tick, (60 / bpm) * 1000);
        }

        function stopMetronome() {
            isPlaying = false;
            clearInterval(timerId);
            startBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start Metronome';
            startBtn.style.background = 'var(--accent-color)';

            const dots = beatDotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                dots[i].classList.remove('active');
            }
        }

        function restartMetronome() {
            clearInterval(timerId);
            timerId = setInterval(tick, (60 / bpm) * 1000);
        }

        function handleTapTempo() {
            const now = Date.now();
            tapTimes.push(now);

            if (tapTimes.length > 4) tapTimes.shift();

            if (tapTimes.length > 1) {
                const intervals = [];
                for (let i = 1; i < tapTimes.length; i++) {
                    intervals.push(tapTimes[i] - tapTimes[i - 1]);
                }
                const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                const calculatedBpm = Math.round(60000 / avgInterval);

                if (calculatedBpm >= 30 && calculatedBpm <= 250) {
                    bpm = calculatedBpm;
                    updateBpmUI();
                }
            }
        }

        // Initialize dots
        setupDots();
    </script>
</body>
</html>
