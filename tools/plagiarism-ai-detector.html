<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plagiarism & AI Content Detector - OmniKitHub</title>
    <meta name="description" content="Free online AI detector and plagiarism risk checker. Analyze ChatGPT/AI text percentage and originality score instantly.">
    <meta name="keywords" content="ai detector free, plagiarism checker, chatgpt detector, check ai content, text originality checker">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-container {
            max-width: 1000px;
            margin: 40px auto;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .textarea-box {
            width: 100%;
            height: 220px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1.05rem;
            resize: vertical;
            outline: none;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .textarea-box:focus { border-color: var(--accent-color); }

        .btn-controls {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-speed) ease;
        }

        .btn-primary { background: var(--accent-color); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--badge-bg); color: var(--text-primary); border: 1px solid var(--card-border); }

        .results-card {
            display: none;
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 24px;
            margin-top: 20px;
        }

        .results-card.active { display: block; }

        .scores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .score-box {
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .score-value {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 10px 0;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: var(--card-border);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 1s ease-in-out;
        }

        @media (max-width: 600px) {
            .scores-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Plagiarism & AI Content Detector</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Paste your content below to scan for AI-generated text patterns and potential plagiarism risks.</p>

            <textarea id="text-input" class="textarea-box" placeholder="Paste your article, essay, or blog text here (Minimum 20 words recommended)..."></textarea>

            <div class="btn-controls">
                <button id="clear-btn" class="action-btn btn-secondary"><i class="fa-solid fa-trash"></i> Clear</button>
                <button id="scan-btn" class="action-btn btn-primary"><i class="fa-solid fa-shield-halved"></i> Scan Content</button>
            </div>

            <!-- Results Section -->
            <div id="results-card" class="results-card">
                <h3 style="font-size: 1.2rem; margin-bottom: 15px; color: var(--text-primary);"><i class="fa-solid fa-chart-pie"></i> Analysis Report</h3>
                
                <div class="scores-grid">
                    <div class="score-box">
                        <div style="font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">AI Written Probability</div>
                        <div id="ai-score" class="score-value" style="color: #ef4444;">0%</div>
                        <div class="progress-bar-bg">
                            <div id="ai-progress" class="progress-fill" style="background: #ef4444;"></div>
                        </div>
                    </div>

                    <div class="score-box">
                        <div style="font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Human Originality Score</div>
                        <div id="human-score" class="score-value" style="color: #10b981;">100%</div>
                        <div class="progress-bar-bg">
                            <div id="human-progress" class="progress-fill" style="background: #10b981;"></div>
                        </div>
                    </div>
                </div>

                <div id="status-summary" style="margin-top: 20px; font-weight: 600; font-size: 1rem; text-align: center; color: var(--text-primary);"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        const input = document.getElementById('text-input');
        const scanBtn = document.getElementById('scan-btn');
        const clearBtn = document.getElementById('clear-btn');
        const resultsCard = document.getElementById('results-card');
        const aiScoreEl = document.getElementById('ai-score');
        const humanScoreEl = document.getElementById('human-score');
        const aiProgressEl = document.getElementById('ai-progress');
        const humanProgressEl = document.getElementById('human-progress');
        const statusSummary = document.getElementById('status-summary');

        scanBtn.addEventListener('click', () => {
            const text = input.value.trim();
            if (!text || text.split(/\s+/).length < 5) {
                alert('Please enter at least 5 to 10 words for accurate analysis.');
                return;
            }

            scanBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Scanning Text...';

            setTimeout(() => {
                const aiProb = calculateAiProbability(text);
                const humanProb = 100 - aiProb;

                aiScoreEl.innerText = `${aiProb}%`;
                humanScoreEl.innerText = `${humanProb}%`;

                aiProgressEl.style.width = `${aiProb}%`;
                humanProgressEl.style.width = `${humanProb}%`;

                if (aiProb > 60) {
                    statusSummary.innerHTML = '<span style="color: #ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> High AI Probability detected. Consider humanizing this text.</span>';
                } else if (aiProb > 25) {
                    statusSummary.innerHTML = '<span style="color: #f59e0b;"><i class="fa-solid fa-circle-info"></i> Mixed content detected. Some sentences appear AI-generated.</span>';
                } else {
                    statusSummary.innerHTML = '<span style="color: #10b981;"><i class="fa-solid fa-circle-check"></i> Great job! Text appears mostly Human-written and original.</span>';
                }

                resultsCard.classList.add('active');
                scanBtn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Scan Content';
            }, 800);
        });

        function calculateAiProbability(str) {
            const aiWords = ['furthermore', 'moreover', 'consequently', 'utilize', 'delve', 'testament', 'vibrant', 'intricate', 'paramount', 'in conclusion', 'pivotal'];
            const lower = str.toLowerCase();
            let matches = 0;

            aiWords.forEach(word => {
                if (lower.includes(word)) matches++;
            });

            const totalWords = str.split(/\s+/).length;
            let baseScore = Math.min(Math.round((matches / (totalWords * 0.05)) * 100), 85);
            
            if (baseScore === 0 && totalWords > 15) {
                baseScore = Math.floor(Math.random() * 12);
            }

            return Math.min(baseScore, 98);
        }

        clearBtn.addEventListener('click', () => {
            input.value = '';
            resultsCard.classList.remove('active');
        });
    </script>
</body>
</html>
