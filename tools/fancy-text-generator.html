    function renderFonts() {
        const input = inputText.value.trim() || 'OmniKitHub Stylish Text';
        resultsList.innerHTML = '';

        fontGenerators.forEach(fg => {
            if (currentCategory === 'all' || fg.cat === currentCategory) {
                const generatedText = fg.gen(input);

                const card = document.createElement('div');
                card.className = 'font-card';
                card.innerHTML = `
                    <div class="font-text">${generatedText}</div>
                    <button class="btn-copy" onclick="copyFontText('${escapeQuotes(generatedText)}')">📋 Copy</button>
                `;
                resultsList.appendChild(card);
            }
        });
    }

    function escapeQuotes(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function copyFontText(text) {
        navigator.clipboard.writeText(text);
        showToast();
    }

    function showToast() {
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function filterCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderFonts();
    }

    // Dark Mode Toggle
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    // Action Buttons
    document.getElementById('clearBtn').addEventListener('click', () => {
        inputText.value = '';
        renderFonts();
    });

    document.getElementById('downloadTxtBtn').addEventListener('click', () => {
        const input = inputText.value.trim() || 'OmniKitHub Stylish Text';
        let txtContent = `Fancy Text Styles for: "${input}"\n\n`;
        fontGenerators.forEach(fg => {
            txtContent += `${fg.name}:\n${fg.gen(input)}\n\n`;
        });

        const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'fancy-text-styles.txt';
        a.click();
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Fancy Text & Font Generator',
                    text: 'Check out these awesome font styles and bio generators!',
                    url: window.location.href
                });
            } catch (err) { console.log(err); }
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Tool link copied to clipboard!');
        }
    });

    inputText.addEventListener('input', renderFonts);

    // Initial Load
    renderFonts();
