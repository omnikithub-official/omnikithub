<body>

<div class="container">
    <div class="header">
        <h1>🎙️ Speech to Text (Voice Typing) & Text Editor</h1>
    </div>
    <p class="description">Voice typing tool with Bangla, Banglish, and English support. Includes PDF download, printing, text styling, and instant sharing features.</p>

    <div class="controls">
        <select id="languageSelect">
            <option value="bn-BD">Bangla (Bangladesh) - বাংলা</option>
            <option value="bn-IN">Bangla (India) - বাংলা</option>
            <option value="banglish">Banglish to Bangla (Phonetic)</option>
            <option value="en-US" selected>English (United States)</option>
            <option value="en-GB">English (United Kingdom)</option>
        </select>

        <button id="startBtn" class="btn-primary">🎤 Start Listening</button>
        <button id="stopBtn" class="btn-danger" disabled>🛑 Stop</button>
        <button id="clearBtn" class="btn-secondary">🗑️ Clear</button>
    </div>

    <div class="options-bar">
        <label><input type="checkbox" id="autoPunctuation" checked> Auto Punctuation & Correction</label>
    </div>

    <!-- Text Formatting Toolbar (MS Word Style) -->
    <div class="formatting-toolbar">
        <button onclick="execCmd('bold')"><b>B</b></button>
        <button onclick="execCmd('italic')"><i>I</i></button>
        <button onclick="execCmd('underline')"><u>U</u></button>
        
        <label>Size:</label>
        <select onchange="execCmd('fontSize', this.value)">
            <option value="3">Normal</option>
            <option value="4">Medium</option>
            <option value="5">Large</option>
            <option value="6">Extra Large</option>
        </select>

        <label>Color:</label>
        <input type="color" onchange="execCmd('foreColor', this.value)" value="#000000">

        <button onclick="changeCase('upper')">AA</button>
        <button onclick="changeCase('lower')">aa</button>
    </div>

    <!-- Rich Text Editable Area -->
    <div id="editor" contenteditable="true" placeholder="Your spoken text will appear here automatically..."></div>

    <div class="status-bar">
        <div>Words: <span id="wordCount">0</span> | Characters: <span id="charCount">0</span></div>
        <div id="recordingStatus" class="recording-indicator">
            <span class="dot"></span> Listening...
        </div>
    </div>

    <!-- Action Toolbar (PDF, Print, Share, Copy) -->
    <div class="controls" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
        <button id="copyBtn" class="btn-secondary">📋 Copy Text</button>
        <button id="downloadTxtBtn" class="btn-secondary">📥 Download .TXT</button>
        <button id="downloadPdfBtn" class="btn-secondary">📄 Download PDF</button>
        <button id="printBtn" class="btn-secondary">🖨️ Print</button>
        <button id="shareWhatsappBtn" class="btn-whatsapp">💬 Share WhatsApp</button>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadTxtBtn = document.getElementById('downloadTxtBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const printBtn = document.getElementById('printBtn');
    const shareWhatsappBtn = document.getElementById('shareWhatsappBtn');
    const editor = document.getElementById('editor');
    const languageSelect = document.getElementById('languageSelect');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const recordingStatus = document.getElementById('recordingStatus');
    const autoPunctuation = document.getElementById('autoPunctuation');

    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            recordingStatus.style.display = 'flex';
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }

            if (finalTranscript !== '') {
                let formattedText = processText(finalTranscript, languageSelect.value);
                let currentContent = editor.innerText.trim();
                editor.innerText = currentContent ? currentContent + ' ' + formattedText : formattedText;
                updateCounts();
            }
        };

        recognition.onend = () => {
            isListening = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            recordingStatus.style.display = 'none';
        };
    } else {
        alert('Your browser does not support Speech Recognition. Please use Google Chrome or Microsoft Edge.');
    }

    function banglishToBangla(text) {
        const map = {
            'ami': 'আমি', 'tomar': 'তোমার', 'sathe': 'সাথে', 'sate': 'সাথে',
            'dekha': 'দেখা', 'korte': 'করতে', 'chai': 'চাই', 'kemon': 'কেমন',
            'acho': 'আছো', 'achho': 'আছো', 'dhanyabad': 'ধন্যবাদ', 'dhonnobad': 'ধন্যবাদ',
            'bhalo': 'ভালো', 'valo': 'ভালো', 'na': 'না', 'ha': 'হ্যাঁ', 'han': 'হ্যাঁ'
        };
        let words = text.toLowerCase().split(' ');
        let converted = words.map(w => map[w] || w);
        return converted.join(' ');
    }

    function processText(text, lang) {
        let processed = text;
        if (lang === 'banglish') {
            processed = banglishToBangla(processed);
        }
        if (autoPunctuation.checked) {
            processed = processed.trim();
            if (!/[.?!।]$/.test(processed)) {
                processed += (lang.startsWith('bn') || lang === 'banglish') ? '।' : '.';
            }
        }
        return processed;
    }

    startBtn.addEventListener('click', () => {
        recognition.lang = languageSelect.value === 'banglish' ? 'en-US' : languageSelect.value;
        recognition.start();
    });

    stopBtn.addEventListener('click', () => recognition.stop());
    clearBtn.addEventListener('click', () => { editor.innerHTML = ''; updateCounts(); });

    // Formatting Functions
    function execCmd(command, value = null) {
        document.execCommand(command, false, value);
    }

    function changeCase(type) {
        let text = editor.innerText;
        editor.innerText = type === 'upper' ? text.toUpperCase() : text.toLowerCase();
    }

    // Copy, Download, Print & Share
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(editor.innerText);
        alert('Text copied to clipboard!');
    });

    downloadTxtBtn.addEventListener('click', () => {
        const blob = new Blob([editor.innerText], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'voice-typing.txt';
        a.click();
    });

    downloadPdfBtn.addEventListener('click', () => {
        const opt = {
            margin: 1,
            filename: 'voice-typing.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(editor).save();
    });

    printBtn.addEventListener('click', () => window.print());

    shareWhatsappBtn.addEventListener('click', () => {
        const text = encodeURIComponent(editor.innerText);
        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    });

    editor.addEventListener('input', updateCounts);

    function updateCounts() {
        const text = editor.innerText.trim();
        wordCount.innerText = text ? text.split(/\s+/).length : 0;
        charCount.innerText = text.length;
    }
</script>

</body>
