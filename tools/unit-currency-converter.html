    <style>

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header h1 { font-size: 24px; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }

        }

        .tab-btn.active {

        /* Converter Grid */
        .converter-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;

        }

        @media (max-width: 700px) {
            .converter-grid { grid-template-columns: 1fr; }
        }

        .input-group label { display: block; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }

        select, input[type="number"] {
            width: 100%;
            padding: 12px 14px;

            color: white;

            justify-content: center;

        .swap-btn:hover { transform: rotate(180deg); }

        /* Result Display Box */
        .result-card {
            background: rgba(37, 99, 235, 0.04);

        }

        .result-title { font-size: 13px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .result-value { font-size: 38px; font-weight: 900; color: var(--primary-color); word-break: break-word; }

        /* Actions */
        .action-bar { display: flex; gap: 12px; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; background: var(--primary-color); color: white; font-weight: 600; cursor: pointer; font-size: 14px; flex: 1; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }

        .site-footer a { color: #38bdf8; text-decoration: none; margin: 0 8px; }

<body>

<!-- Site Header Navigation -->
<header class="site-navbar">
    <a href="https://omnikithub.com" class="brand-logo">
        📦 OmniKit<span>Hub</span>
    </a>
    <nav class="nav-links">
        <a href="https://omnikithub.com">Home</a>
        <a href="https://omnikithub.com/#tools">All Tools</a>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </nav>
</header>

<!-- Main Tool Wrapper -->
<main class="main-wrapper">
    <div class="app-container">
        <div class="header">
            <h1>🔄 Pro Unit & Currency Converter</h1>
        </div>
        <p class="description">Convert length, weight, temperature, digital data, area, speed, and real-time currencies instantly.</p>

        <!-- Category Tabs -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('length')">📏 Length</button>
            <button class="tab-btn" onclick="switchCategory('weight')">⚖️ Weight</button>
            <button class="tab-btn" onclick="switchCategory('temp')">🌡️ Temperature</button>
            <button class="tab-btn" onclick="switchCategory('digital')">💾 Digital Data</button>
            <button class="tab-btn" onclick="switchCategory('currency')">💱 Currency</button>
        </div>

        <!-- Converter Form -->
        <div class="converter-grid">
            <div class="input-group">
                <label>From Unit:</label>
                <select id="fromUnit" onchange="calculate()"></select>
                <div style="margin-top: 10px;">
                    <label>Amount:</label>
                    <input type="number" id="fromVal" value="1" oninput="calculate()">
                </div>
            </div>

            <button class="swap-btn" onclick="swapUnits()">⇄</button>

            <div class="input-group">
                <label>To Unit:</label>
                <select id="toUnit" onchange="calculate()"></select>
                <div style="margin-top: 10px;">
                    <label>Converted Output:</label>
                    <input type="number" id="toVal" readonly placeholder="Result">
                </div>
            </div>
        </div>

        <!-- Big Result Card -->
        <div class="result-card">
            <div class="result-title">Converted Value</div>
            <div class="result-value" id="resultDisplay">0.001</div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <button class="btn" id="copyBtn">📋 Copy Result</button>
            <button class="btn btn-outline" id="shareBtn">🔗 Share Tool</button>
        </div>
    </div>
</main>

<!-- Site Global Footer -->
<footer class="site-footer">
    <p>© 2026 <b>OmniKitHub.com</b>. All rights reserved.</p>
    <p style="margin-top: 6px;">
        <a href="https://omnikithub.com">Home</a> | 
        <a href="https://omnikithub.com/privacy.html">Privacy Policy</a> | 
        <a href="https://omnikithub.com/terms.html">Terms of Service</a>
    </p>
</footer>

<script>
    let currentCategory = 'length';

    const units = {
        length: {
            'Meter': 1,
            'Kilometer': 1000,
            'Centimeter': 0.01,
            'Millimeter': 0.001,
            'Mile': 1609.34,
            'Yard': 0.9144,
            'Foot': 0.3048,
            'Inch': 0.0254
        },
        weight: {
            'Kilogram': 1,
            'Gram': 0.001,
            'Milligram': 0.000001,
            'Pound': 0.453592,
            'Ounce': 0.0283495,
            'Ton': 1000
        },
        temp: {
            'Celsius': 'C',
            'Fahrenheit': 'F',
            'Kelvin': 'K'
        },
        digital: {
            'Byte (B)': 1,
            'Kilobyte (KB)': 1024,
            'Megabyte (MB)': 1048576,
            'Gigabyte (GB)': 1073741824,
            'Terabyte (TB)': 1099511627776
        },
        currency: {
            'USD ($)': 1,
            'EUR (€)': 0.92,
            'GBP (£)': 0.78,
            'BDT (৳)': 118.5,
            'INR (₹)': 83.5,
            'CAD ($)': 1.37,
            'AUD ($)': 1.51
        }
    };

    function populateUnits() {
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        fromSelect.innerHTML = '';
        toSelect.innerHTML = '';

        const currentUnits = Object.keys(units[currentCategory]);
        currentUnits.forEach((unit, index) => {
            fromSelect.options.add(new Option(unit, unit));
            toSelect.options.add(new Option(unit, unit));
        });

        if(currentUnits.length > 1) {
            toSelect.selectedIndex = 1;
        }
    }

    function calculate() {
        const fromUnit = document.getElementById('fromUnit').value;
        const toUnit = document.getElementById('toUnit').value;
        const fromVal = parseFloat(document.getElementById('fromVal').value) || 0;
        let result = 0;

        if(currentCategory === 'temp') {
            result = convertTemperature(fromVal, fromUnit, toUnit);
        } else {
            const baseValue = fromVal * units[currentCategory][fromUnit];
            result = baseValue / units[currentCategory][toUnit];
        }

        const formattedResult = Number.isInteger(result) ? result : result.toFixed(4);
        document.getElementById('toVal').value = formattedResult;
        document.getElementById('resultDisplay').innerText = `${formattedResult} ${toUnit.split(' ')[0]}`;
    }

    function convertTemperature(value, from, to) {
        let celsius = value;
        if(from === 'Fahrenheit') celsius = (value - 32) * 5/9;
        if(from === 'Kelvin') celsius = value - 273.15;

        if(to === 'Celsius') return celsius;
        if(to === 'Fahrenheit') return (celsius * 9/5) + 32;
        if(to === 'Kelvin') return celsius + 273.15;
    }

    function switchCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        populateUnits();
        calculate();
    }

    function swapUnits() {
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        const tempIndex = fromSelect.selectedIndex;
        fromSelect.selectedIndex = toSelect.selectedIndex;
        toSelect.selectedIndex = tempIndex;
        calculate();
    }

    // Initial setup
    populateUnits();
    calculate();

    // Copy Result
    document.getElementById('copyBtn').addEventListener('click', () => {
        const val = document.getElementById('resultDisplay').innerText;
        navigator.clipboard.writeText(val);
        alert('Converted result copied to clipboard!');
    });

    // Dark Mode Toggle
    document.getElementById('themeToggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        document.getElementById('themeToggle').innerText = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    // Share Tool
    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Pro Advanced Unit & Currency Converter',
                    text: 'Convert units and currencies instantly online!',
                    url: window.location.href
                });
            } catch (err) { console.log(err); }
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Tool link copied to clipboard!');
        }
    });
</script>

</body>
</html>
