<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age & Date Calculator - OmniKitHub</title>
    <meta name="description" content="Calculate exact age in years, months, days, and hours online for free. Find time difference between two dates instantly.">
    <meta name="keywords" content="age calculator online, calculate age by date of birth, date difference calculator, next birthday countdown">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg-surface);
            color: var(--text-primary);
            outline: none;
            font-size: 1rem;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background var(--transition-speed) ease;
        }

        .action-btn:hover { background: var(--accent-hover); }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .result-card {
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Age & Date Calculator</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Calculate your exact age in years, months, and days or find duration between dates.</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>Date of Birth:</label>
                    <input type="date" id="dob-input" class="form-control" value="2000-01-01">
                </div>
                <div class="form-group">
                    <label>Calculate Age As Of:</label>
                    <input type="date" id="target-input" class="form-control">
                </div>
            </div>

            <button class="action-btn" onclick="calculateAge()"><i class="fa-solid fa-cake-candles"></i> Calculate Exact Age</button>

            <div class="result-grid">
                <div class="result-card">
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Years</div>
                    <div id="res-years" class="result-value">0</div>
                </div>
                <div class="result-card">
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Months</div>
                    <div id="res-months" class="result-value">0</div>
                </div>
                <div class="result-card">
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Days</div>
                    <div id="res-days" class="result-value">0</div>
                </div>
                <div class="result-card">
                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Total Hours</div>
                    <div id="res-hours" class="result-value">0</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        // Set default target date to today (2026-10-13)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('target-input').value = today;

        function calculateAge() {
            const dobVal = document.getElementById('dob-input').value;
            const targetVal = document.getElementById('target-input').value;

            if (!dobVal || !targetVal) {
                alert('Please select both dates!');
                return;
            }

            const dob = new Date(dobVal);
            const target = new Date(targetVal);

            if (dob > target) {
                alert('Date of birth cannot be after target date!');
                return;
            }

            let years = target.getFullYear() - dob.getFullYear();
            let months = target.getMonth() - dob.getMonth();
            let days = target.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(target.getFullYear(), target.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const diffTime = Math.abs(target - dob);
            const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const totalHours = totalDays * 24;

            document.getElementById('res-years').innerText = years;
            document.getElementById('res-months').innerText = months;
            document.getElementById('res-days').innerText = days;
            document.getElementById('res-hours').innerText = totalHours.toLocaleString();
        }

        // Initial Calculation
        calculateAge();
    </script>
</body>
</html>
