<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; transition: all 0.3s ease; }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header h1 { color: var(--primary-color); font-size: 26px; }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .description { color: #64748b; font-size: 14px; margin-bottom: 20px; }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #64748b;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.02);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats-bar span b { color: var(--primary-color); }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.6;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            resize: vertical;
            margin-bottom: 20px;
        }

        textarea:focus { border-color: var(--primary-color); }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 9px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .btn:hover { background: var(--border-color); }
        .btn-primary { background: var(--primary-color); color: white; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-share { background: #10b981; color: white; border: none; }
        .btn-share:hover { background: #059669; }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        @media print {
            body * { visibility: hidden; }
            .container, .container * { visibility: visible; }
            .container { position: absolute; left: 0; top: 0; width: 100%; shadow: none; }
            .action-bar, .btn-group, .header button { display: none; }
        }
    </style>
</head>
<body>

<div class="container" id="reportArea">
    <div class="header">
        <h1>🔤 Text Case Converter & Cleaner</h1>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>
    <p class="description">Type or paste text below to convert case formatting or clean duplicate lines and extra spaces in 1 click.</p>

    <!-- Real-time Stats -->
    <div class="stats-bar">
        <span>Words: <b id="wordCount">0</b></span>
        <span>Characters: <b id="charCount">0</b></span>
        <span>Sentences: <b id="sentenceCount">0</b></span>
        <span>Lines: <b id="lineCount">0</b></span>
    </div>

    <!-- Text Area -->
    <textarea id="inputText" placeholder="Type or paste your text here to format or clean..."></textarea>

    <!-- Case Converters -->
    <div class="section-title">Case Conversions:</div>
    <div class="btn-group">
        <button class="btn" onclick="convertCase('upper')">UPPERCASE</button>
        <button class="btn" onclick="convertCase('lower')">lowercase</button>
        <button class="btn" onclick="convertCase('title')">Title Case</button>
        <button class="btn" onclick="convertCase('sentence')">Sentence case</button>
        <button class="btn" onclick="convertCase('camel')">camelCase</button>
        <button class="btn" onclick="convertCase('pascal')">PascalCase</button>
        <button class="btn" onclick="convertCase('snake')">snake_case</button>
        <button class="btn" onclick="convertCase('slug')">URL Slug-case</button>
        <button class="btn" onclick="convertCase('alt')">aLtErNaTiNg cAsE</button>
        <button class="btn" onclick="convertCase('invert')">InVeRt cAsE</button>
    </div>

    <!-- Text Cleaners -->
    <div class="section-title">Text Cleaners & Sorting:</div>
    <div class="btn-group">
        <button class="btn" onclick="cleanText('spaces')">🧹 Remove Extra Spaces</button>
        <button class="btn" onclick="cleanText('blank')">📄 Remove Blank Lines</button>
        <button class="btn" onclick="cleanText('duplicates')">📋 Remove Duplicates</button>
        <button class="btn" onclick="cleanText('stripLineBreaks')">🔗 Remove Line Breaks</button>
        <button class="btn" onclick="cleanText('sortAZ')">🔠 Sort Lines (A-Z)</button>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
        <button id="copyBtn" class="btn btn-primary">📋 Copy Output</button>
        <button id="downloadTxtBtn" class="btn">📥 Download (.TXT)</button>
        <button id="downloadPdfBtn" class="btn">📄 Save PDF Report</button>
        <button id="printBtn" class="btn">🖨️ Print</button>
        <button id="shareBtn" class="btn btn-share">🔗 Share Tool</button>
        <button id="clearBtn" class="btn">🗑️ Clear All</button>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const sentenceCount = document.getElementById('sentenceCount');
    const lineCount = document.getElementById('lineCount');
    const themeToggle = document.getElementById('themeToggle');

    function analyzeText() {
        const text = inputText.value;
        const trimmed = text.trim();

        wordCount.innerText = trimmed ? trimmed.split(/\s+/).length : 0;
        charCount.innerText = text.length;
        sentenceCount.innerText = trimmed ? (text.match(/[^.!?]+[.!?]+/g) || [1]).length : 0;
        lineCount.innerText = trimmed ? text.split(/\n/).length : 0;
    }

    function convertCase(type) {
        let text = inputText.value;
        if (!text) return;

        if (type === 'upper') {
            inputText.value = text.toUpperCase();
        } else if (type === 'lower') {
            inputText.value = text.toLowerCase();
        } else if (type === 'title') {
            inputText.value = text.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
        } else if (type === 'sentence') {
            inputText.value = text.toLowerCase().replace(/(^\s*|\.\s*)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());
        } else if (type === 'camel') {
            inputText.value = text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
        } else if (type === 'pascal') {
            let camel = text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
            inputText.value = camel.charAt(0).toUpperCase() + camel.slice(1);
        } else if (type === 'snake') {
            inputText.value = text.toLowerCase().trim().replace(/\s+/g, '_').replace(/[^\w_]/g, '');
        } else if (type === 'slug') {
            inputText.value = text.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
        } else if (type === 'alt') {
            inputText.value = text.split('').map((c, i) => i % 2 === 0 ? c.toLowerCase() : c.toUpperCase()).join('');
        } else if (type === 'invert') {
            inputText.value = text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('');
        }

        analyzeText();
    }

    function cleanText(type) {
        let text = inputText.value;
        if (!text) return;

        if (type === 'spaces') {
            inputText.value = text.replace(/[ \t]+/g, ' ').trim();
        } else if (type === 'blank') {
            inputText.value = text.split('\n').filter(line => line.trim() !== '').join('\n');
        } else if (type === 'duplicates') {
            let lines = text.split('\n');
            inputText.value = [...new Set(lines)].join('\n');
        } else if (type === 'stripLineBreaks') {
            inputText.value = text.replace(/\r?\n|\r/g, ' ');
        } else if (type === 'sortAZ') {
            let lines = text.split('\n');
            inputText.value = lines.sort((a, b) => a.localeCompare(b)).join('\n');
        }

        analyzeText();
    }

    // Dark Mode Toggle
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    // Actions
    document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(inputText.value);
        alert('Output copied to clipboard!');
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        inputText.value = '';
        analyzeText();
    });

    document.getElementById('downloadTxtBtn').addEventListener('click', () => {
        const blob = new Blob([inputText.value], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'converted-text.txt';
        a.click();
    });

    document.getElementById('downloadPdfBtn').addEventListener('click', () => {
        const opt = {
            margin: 0.5,
            filename: 'formatted-text.pdf',
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(document.getElementById('reportArea')).save();
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());

    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Text Case Converter & Cleaner',
                    text: 'Easily convert text cases and clean lines online!',
                    url: window.location.href
                });
            } catch (err) { console.log(err); }
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Tool link copied to clipboard!');
        }
    });

    inputText.addEventListener('input', analyzeText);
</script>

</body>
</html>
