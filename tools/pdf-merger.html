    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; transition: all 0.3s ease; }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header h1 { font-size: 24px; color: var(--primary-color); }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .description { color: #64748b; font-size: 14px; margin-bottom: 20px; }

        /* Mode Switcher Tabs */
        .mode-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.02);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            background: transparent;
            border: none;
            padding: 10px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 6px;
        }
        .mode-btn.active { background: var(--primary-color); color: white; }

        /* Dropzone */
        .dropzone {
            border: 2px dashed var(--primary-color);
            padding: 35px;
            text-align: center;
            border-radius: 10px;
            background: rgba(37, 99, 235, 0.02);
            cursor: pointer;
            margin-bottom: 20px;
        }
        .dropzone:hover { background: rgba(37, 99, 235, 0.05); }
        .dropzone p { font-size: 14px; color: #64748b; margin-top: 8px; }

        /* File List */
        .file-list {
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Action Buttons */
        .action-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary { background: var(--primary-color); color: white; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-share { background: #10b981; color: white; border: none; }

<body>

<div class="app-container">
    <div class="header">
        <h1>📑 Pro PDF Split & Merge Utility</h1>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>
    <p class="description">Combine multiple PDFs into a single unified file or extract specific pages securely inside your browser.</p>

    <!-- Mode Switcher -->
    <div class="mode-switcher">
        <button class="mode-btn active" id="mergeModeBtn" onclick="switchMode('merge')">🔗 Merge PDF Files</button>
        <button class="mode-btn" id="splitModeBtn" onclick="switchMode('split')">✂️ Split / Extract PDF</button>
    </div>

    <!-- Dropzone -->
    <div class="dropzone" onclick="document.getElementById('pdfInput').click()">
        <div style="font-size: 32px;" id="dropIcon">📑</div>
        <p><b id="dropText">Click or Drag PDF Files to Merge</b><br>Supports multiple PDF documents</p>
        <input type="file" id="pdfInput" accept="application/pdf" multiple style="display: none;">
    </div>

    <!-- File Queue List -->
    <div class="file-list" id="fileList">
        <div style="text-align: center; color: #94a3b8; padding: 30px; font-size: 13px;" id="emptyMsg">
            No PDF files uploaded yet.
        </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
        <button id="processBtn" class="btn btn-primary" style="flex: 1; display: none;">⚙️ Process PDF File(s)</button>
        <button id="shareBtn" class="btn btn-share">🔗 Share Tool</button>
        <button id="clearBtn" class="btn">🗑️ Reset All</button>
    </div>
</div>

<script>
    const pdfInput = document.getElementById('pdfInput');
    const fileList = document.getElementById('fileList');
    const emptyMsg = document.getElementById('emptyMsg');
    const processBtn = document.getElementById('processBtn');
    const dropText = document.getElementById('dropText');
    const dropIcon = document.getElementById('dropIcon');
    const themeToggle = document.getElementById('themeToggle');

    let currentMode = 'merge';
    let uploadedFiles = [];

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        if(mode === 'merge') {
            document.getElementById('mergeModeBtn').classList.add('active');
            dropText.innerHTML = '<b>Click or Drag PDF Files to Merge</b><br>Supports multiple PDF documents';
            dropIcon.innerText = '📑';
            pdfInput.multiple = true;
        } else {
            document.getElementById('splitModeBtn').classList.add('active');
            dropText.innerHTML = '<b>Click or Drag a Single PDF to Split</b><br>Extract pages easily';
            dropIcon.innerText = '✂️';
            pdfInput.multiple = false;
        }
        resetAll();
    }

    pdfInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            if (currentMode === 'split') {
                uploadedFiles = [files[0]];
            } else {
                uploadedFiles = uploadedFiles.concat(files);
            }
            renderFileList();
        }
    });

    function renderFileList() {
        if (uploadedFiles.length === 0) {
            fileList.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px; font-size: 13px;" id="emptyMsg">No PDF files uploaded yet.</div>`;
            processBtn.style.display = 'none';
            return;
        }

        fileList.innerHTML = '';
        uploadedFiles.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `<span><b>#${index + 1}</b> ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                              <span style="color: #64748b; font-size: 11px;">Ready</span>`;
            fileList.appendChild(item);
        });

        processBtn.style.display = 'block';
        processBtn.innerText = currentMode === 'merge' ? `⚙️ Merge ${uploadedFiles.length} PDF(s)` : `⚙️ Process & Extract PDF`;
    }

    processBtn.addEventListener('click', () => {
        if (uploadedFiles.length === 0) return;
        alert(currentMode === 'merge' 
            ? `Successfully merged ${uploadedFiles.length} PDF documents! (Demo execution simulation)` 
            : `Successfully extracted pages from ${uploadedFiles[0].name}! (Demo execution simulation)`);
    });

    // Dark Mode
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    function resetAll() {
        uploadedFiles = [];
        pdfInput.value = '';
        renderFileList();
    }

    document.getElementById('clearBtn').addEventListener('click', resetAll);

    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Pro PDF Split & Merge Utility',
                    text: 'Combine multiple PDFs or extract pages online instantly!',
                    url: window.location.href
                });
            } catch (err) { console.log(err); }
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Tool link copied to clipboard!');
        }
    });
</script>

</body>
