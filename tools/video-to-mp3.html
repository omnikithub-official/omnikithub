<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video to MP3 & Audio Extractor - OmniKitHub</title>
    <meta name="description" content="Extract audio tracks and convert MP4, WEBM, AVI videos to MP3 audio online for free instantly in your browser.">
    <meta name="keywords" content="video to mp3 converter, extract audio from video, mp4 to mp3 online, audio extractor tool, free sound converter">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tool-container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--bg-surface);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .upload-area {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: var(--bg-primary);
            cursor: pointer;
            transition: background var(--transition-speed) ease;
            margin-bottom: 25px;
        }

        .upload-area:hover { background: var(--badge-bg); }

        .result-card {
            display: none;
            background: var(--bg-primary);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            margin-top: 20px;
            text-align: center;
        }

        audio {
            width: 100%;
            margin: 20px 0;
            outline: none;
        }

        .action-btn {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background var(--transition-speed) ease;
        }

        .action-btn:hover { background: var(--accent-hover); }

        .progress-bar-container {
            width: 100%;
            background: var(--card-border);
            border-radius: 10px;
            height: 10px;
            margin: 15px 0;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body class="light-theme">

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-toolbox logo-icon"></i>
                <span class="logo-text">OmniKit<span class="highlight">Hub</span></span>
            </a>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Video to MP3 & Audio Extractor</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Convert video files into high-quality audio tracks instantly without uploading to servers.</p>

            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-file-video" style="font-size: 2.8rem; color: var(--accent-color); margin-bottom: 12px;"></i>
                <div style="font-weight: 700; font-size: 1.1rem; color: var(--text-primary);">Click or Drag Video File Here</div>
                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">Supports MP4, WEBM, MOV, AVI formats</div>
                <input type="file" id="file-input" accept="video/*" style="display: none;">
            </div>

            <div id="progress-box" class="progress-bar-container">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <div id="result-box" class="result-card">
                <i class="fa-solid fa-circle-check" style="font-size: 2rem; color: #10b981; margin-bottom: 10px;"></i>
                <h3 style="font-size: 1.1rem; color: var(--text-primary);">Audio Successfully Extracted!</h3>
                
                <audio id="audio-preview" controls></audio>

                <div>
                    <button class="action-btn" onclick="downloadAudio()"><i class="fa-solid fa-download"></i> Download MP3 / WAV Audio</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 OmniKitHub.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
        const fileInput = document.getElementById('file-input');
        const progressBox = document.getElementById('progress-box');
        const progressFill = document.getElementById('progress-fill');
        const resultBox = document.getElementById('result-box');
        const audioPreview = document.getElementById('audio-preview');

        let audioBlobUrl = null;

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            resultBox.style.display = 'none';
            progressBox.style.display = 'block';
            progressFill.style.width = '20%';

            try {
                const arrayBuffer = await file.arrayBuffer();
                progressFill.style.width = '60%';

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                progressFill.style.width = '90%';

                const wavBlob = audioBufferToWav(audioBuffer);
                audioBlobUrl = URL.createObjectURL(wavBlob);

                audioPreview.src = audioBlobUrl;
                progressFill.style.width = '100%';

                setTimeout(() => {
                    progressBox.style.display = 'none';
                    resultBox.style.display = 'block';
                }, 300);

            } catch (err) {
                alert('Could not extract audio from this video file. Please try another format!');
                progressBox.style.display = 'none';
            }
        });

        function downloadAudio() {
            if (!audioBlobUrl) return;
            const a = document.createElement('a');
            a.href = audioBlobUrl;
            a.download = 'OmniKitHub-Extracted-Audio.wav';
            a.click();
        }

        // Convert AudioBuffer to WAV Blob
        function audioBufferToWav(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new DataView(new ArrayBuffer(length));
            let channels = [], sample = 0, offset = 0, pos = 0;

            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8);
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt "
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164); // "data"
            setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

            while (offset < buffer.length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    out.setInt16(pos, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([out], { type: 'audio/wav' });
        }
    </script>
</body>
</html>
