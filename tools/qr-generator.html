<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Interactive QR Code Generator & Stylist | OmniKitHub</title>
    <meta name="description" content="Free online Pro QR Code Generator. Create custom QR codes for URLs, WiFi networks, vCards, text, and emails with custom colors and logo integration.">
    <meta name="keywords" content="qr code generator, custom qr maker, wifi qr code generator, vcard qr code builder, logo qr code generator, free online qr tools">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://omnikithub.com/tools/qr-generator.html">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Pro Interactive QR Code Generator & Stylist - OmniKitHub">
    <meta property="og:description" content="Generate custom branded QR codes with colors, logos, WiFi setups, and high-resolution PNG download.">
    <meta property="og:url" content="https://omnikithub.com/tools/qr-generator.html">
    <meta property="og:type" content="website">

    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Schema.org Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Pro Interactive QR Code Generator & Stylist",
      "url": "https://omnikithub.com/tools/qr-generator.html",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; transition: all 0.3s ease; }

        .app-container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header h1 { font-size: 24px; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .description { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        /* Main Workspace */
        .workspace {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
        }

        @media (max-width: 850px) {
            .workspace { grid-template-columns: 1fr; }
        }

        /* Controls Box */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .type-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.02);
            color: var(--text-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        
        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        /* Preview Panel */
        .preview-panel {
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 220px;
            min-height: 220px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>📱 Pro Interactive QR Code Studio</h1>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>
    <p class="description">Generate custom branded QR codes for URLs, WiFi networks, contacts, emails, and custom text with custom colors.</p>

    <div class="workspace">
        <!-- Controls -->
        <div class="control-panel">
            <!-- Type Tabs -->
            <div class="type-tabs">
                <button class="tab-btn active" onclick="switchType('url')">🌐 URL</button>
                <button class="tab-btn" onclick="switchType('text')">📝 Plain Text</button>
                <button class="tab-btn" onclick="switchType('wifi')">📶 Wi-Fi Network</button>
                <button class="tab-btn" onclick="switchType('email')">✉️ Email</button>
            </div>

            <!-- Dynamic Input Area -->
            <div id="dynamicInputs">
                <div class="input-group">
                    <label>Website URL:</label>
                    <input type="text" id="qrInput" value="https://omnikithub.com" placeholder="Enter URL e.g. https://omnikithub.com">
                </div>
            </div>

            <!-- Color Options -->
            <div class="color-grid">
                <div class="input-group">
                    <label>QR Foreground Color:</label>
                    <input type="color" id="fgColor" value="#000000">
                </div>
                <div class="input-group">
                    <label>Background Color:</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
            </div>

            <!-- Resolution Size -->
            <div class="input-group">
                <label>QR Code Size (Pixels):</label>
                <select id="qrSize">
                    <option value="200">Medium (200 x 200)</option>
                    <option value="300" selected>High (300 x 300)</option>
                    <option value="400">Ultra High (400 x 400)</option>
                </select>
            </div>
        </div>

        <!-- Live Preview -->
        <div class="preview-panel">
            <div class="qr-box" id="qrcode"></div>
            <button id="downloadBtn" class="btn">📥 Download High Quality PNG</button>
            <button id="shareBtn" class="btn btn-outline">🔗 Share Tool</button>
        </div>
    </div>
</div>

<script>
    const qrContainer = document.getElementById("qrcode");
    const fgColorInput = document.getElementById("fgColor");
    const bgColorInput = document.getElementById("bgColor");
    const qrSizeInput = document.getElementById("qrSize");
    const themeToggle = document.getElementById("themeToggle");
    let currentType = 'url';
    let qrcodeObj = null;

    function generateQR() {
        qrContainer.innerHTML = "";
        let content = getQRContent();

        qrcodeObj = new QRCode(qrContainer, {
            text: content || "https://omnikithub.com",
            width: parseInt(qrSizeInput.value),
            height: parseInt(qrSizeInput.value),
            colorDark: fgColorInput.value,
            colorLight: bgColorInput.value,
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function getQRContent() {
        if(currentType === 'url') {
            return document.getElementById("qrInput") ? document.getElementById("qrInput").value : "https://omnikithub.com";
        } else if(currentType === 'text') {
            return document.getElementById("textInput") ? document.getElementById("textInput").value : "";
        } else if(currentType === 'wifi') {
            const ssid = document.getElementById("wifiSsid") ? document.getElementById("wifiSsid").value : "";
            const pass = document.getElementById("wifiPass") ? document.getElementById("wifiPass").value : "";
            const type = document.getElementById("wifiType") ? document.getElementById("wifiType").value : "WPA";
            return `WIFI:T:${type};S:${ssid};P:${pass};;`;
        } else if(currentType === 'email') {
            const email = document.getElementById("emailAddr") ? document.getElementById("emailAddr").value : "";
            const subject = document.getElementById("emailSub") ? document.getElementById("emailSub").value : "";
            return `mailto:${email}?subject=${encodeURIComponent(subject)}`;
        }
        return "https://omnikithub.com";
    }

    function switchType(type) {
        currentType = type;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const container = document.getElementById('dynamicInputs');
        if(type === 'url') {
            container.innerHTML = `
                <div class="input-group">
                    <label>Website URL:</label>
                    <input type="text" id="qrInput" value="https://omnikithub.com" placeholder="Enter URL">
                </div>`;
        } else if(type === 'text') {
            container.innerHTML = `
                <div class="input-group">
                    <label>Plain Text / Message:</label>
                    <textarea id="textInput" rows="3" placeholder="Enter text content here...">Welcome to OmniKitHub Platform</textarea>
                </div>`;
        } else if(type === 'wifi') {
            container.innerHTML = `
                <div class="input-group">
                    <label>Wi-Fi SSID / Network Name:</label>
                    <input type="text" id="wifiSsid" placeholder="Home WiFi Name" value="MyHomeWiFi">
                </div>
                <div class="input-group" style="margin-top:10px;">
                    <label>Wi-Fi Password:</label>
                    <input type="password" id="wifiPass" placeholder="Password" value="12345678">
                </div>
                <div class="input-group" style="margin-top:10px;">
                    <label>Security Encryption:</label>
                    <select id="wifiType"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option></select>
                </div>`;
        } else if(type === 'email') {
            container.innerHTML = `
                <div class="input-group">
                    <label>Recipient Email:</label>
                    <input type="email" id="emailAddr" placeholder="support@omnikithub.com" value="support@omnikithub.com">
                </div>
                <div class="input-group" style="margin-top:10px;">
                    <label>Email Subject:</label>
                    <input type="text" id="emailSub" placeholder="Inquiry Subject" value="Inquiry from OmniKitHub">
                </div>`;
        }

        attachInputListeners();
        generateQR();
    }

    function attachInputListeners() {
        const inputs = document.querySelectorAll('#dynamicInputs input, #dynamicInputs textarea, #dynamicInputs select');
        inputs.forEach(input => input.addEventListener('input', generateQR));
    }

    fgColorInput.addEventListener('change', generateQR);
    bgColorInput.addEventListener('change', generateQR);
    qrSizeInput.addEventListener('change', generateQR);

    // Initial Setup
    attachInputListeners();
    generateQR();

    // Download PNG
    document.getElementById("downloadBtn").addEventListener("click", () => {
        const img = qrContainer.querySelector("img");
        if(img) {
            const a = document.createElement("a");
            a.href = img.src;
            a.download = `QRCode_OmniKitHub_${Date.now()}.png`;
            a.click();
        }
    });

    // Dark Mode Toggle
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    // Share Tool
    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Pro Interactive QR Code Generator',
                    text: 'Create custom branded QR codes instantly online!',
                    url: window.location.href
                });
            } catch (err) { console.log(err); }
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert('Tool link copied to clipboard!');
        }
    });
</script>

</body>
</html>
