<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Assistant & Content Humanizer - Free Online Tool | OmniKitHub</title>
    <meta name="description" content="Free AI Content Humanizer, AI Detector Eraser, Summarizer, and Study Assistant. Convert AI text to natural human writing, solve questions, and export to PDF.">
    <meta name="keywords" content="ai humanizer, humanize ai text, ai detector bypass, free ai assistant, ai summarizer, fix grammar ai, student ai helper, ai to human text converter">

    <meta property="og:description" content="Humanize AI content, bypass AI detection, summarize notes, and download responses in PDF instantly.">

    <meta property="og:type" content="website">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    {
      "@context": "https://schema.org",
      "@type": "WebApplication",

      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",

        "priceCurrency": "USD"
      }

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; }

        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header h1 { color: var(--primary-color); font-size: 26px; }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .description { color: #64748b; font-size: 14px; margin-bottom: 20px; }

        /* Dashboard Presets */
        .dashboard-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .preset-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.02);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover, .preset-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Mode Selectors */
        .mode-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, input[type="file"] {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .editor-grid { grid-template-columns: 1fr; }
        }

        .panel { display: flex; flex-direction: column; gap: 8px; }
        .panel label { font-size: 13px; font-weight: 600; color: #64748b; }

        textarea, .output-box {
            width: 100%;
            height: 280px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.6;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--border-color); color: var(--text-color); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }

        .status-info { font-size: 13px; color: #64748b; margin-top: 8px; }

        @media print {
            body * { visibility: hidden; }
            #outputBox, #outputBox * { visibility: visible; }
            #outputBox { position: absolute; left: 0; top: 0; width: 100%; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🧠 Smart AI Assistant & Content Humanizer</h1>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>
    <p class="description">Transform AI text into natural human writing, solve student questions, summarize documents, fix grammar, and export results in PDF or Image.</p>

    <!-- Dashboard Quick Action Presets -->
    <div class="dashboard-presets">
        <button class="preset-btn active" onclick="setMode('humanize')">👤 Humanize AI Text</button>
        <button class="preset-btn" onclick="setMode('ask')">❓ Ask Question / Solve Task</button>
        <button class="preset-btn" onclick="setMode('summarize')">📑 Summarize Content</button>
        <button class="preset-btn" onclick="setMode('grammar')">✏️ Fix Grammar & Tone</button>
    </div>

    <div class="mode-bar">
        <label>Writing Style Tone:</label>
        <select id="toneSelect">
            <option value="natural">Natural Human (Casual)</option>
            <option value="academic" selected>Academic Student Style</option>
            <option value="professional">Professional Business</option>
        </select>

        <label>Upload Document/Image:</label>
        <input type="file" id="fileInput" accept=".txt,.pdf,image/*">
    </div>

    <!-- Dual Panel Editor -->
    <div class="editor-grid">
        <div class="panel">
            <label>Input Text / Prompt / Uploaded File Content:</label>
            <textarea id="inputText" placeholder="Paste AI content here or ask any question for teachers and students..."></textarea>
            <div class="status-info">Input Words: <span id="inWords">0</span></div>
        </div>

        <div class="panel">
            <label>Output Result / Humanized Text:</label>
            <div id="outputBox" class="output-box">Your processed humanized text or AI response will appear here...</div>
            <div class="status-info">Output Words: <span id="outWords">0</span></div>
        </div>
    </div>

    <!-- Action Toolbar -->
    <div class="actions">
        <button id="processBtn" class="btn btn-primary">⚡ Process & Humanize</button>
        <button id="copyBtn" class="btn btn-secondary">📋 Copy Output</button>
        <button id="downloadPdfBtn" class="btn btn-secondary">📄 Download PDF</button>
        <button id="downloadImgBtn" class="btn btn-secondary">🖼️ Save Image (PNG)</button>
        <button id="printBtn" class="btn btn-secondary">🖨️ Print</button>
        <button id="shareBtn" class="btn btn-success">🔗 Share Anywhere</button>
        <button id="clearBtn" class="btn btn-secondary">🗑️ Clear</button>
    </div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputBox = document.getElementById('outputBox');
    const processBtn = document.getElementById('processBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const themeToggle = document.getElementById('themeToggle');
    const toneSelect = document.getElementById('toneSelect');
    const fileInput = document.getElementById('fileInput');
    const inWords = document.getElementById('inWords');
    const outWords = document.getElementById('outWords');

    let currentMode = 'humanize';

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if(mode === 'humanize') inputText.placeholder = 'Paste AI-generated text here to make it 100% human-written...';
        else if(mode === 'ask') inputText.placeholder = 'Type your homework question, topic explanation, or assignment prompt...';
        else if(mode === 'summarize') inputText.placeholder = 'Paste long notes, articles, or essays to summarize into key points...';
        else if(mode === 'grammar') inputText.placeholder = 'Paste text here to fix spelling, punctuation, and sentence flow...';
    }

    // Process Humanizer Engine Mock
    processBtn.addEventListener('click', () => {
        let text = inputText.value.trim();
        if(!text) {
            alert('Please enter or paste some text first!');
            return;
        }

        outputBox.innerText = 'Processing with AI Humanizer Engine... Please wait...';

        setTimeout(() => {
            let processed = text;
            if (currentMode === 'humanize') {
                processed = humanizeText(text, toneSelect.value);
            } else if (currentMode === 'summarize') {
                processed = '📌 Key Summary Points:\n\n' + text.split('. ').slice(0, 3).join('.\n• ') + '.';
            } else if (currentMode === 'grammar') {
                processed = text.replace(/\b(i)\b/g, 'I').replace(/\s+/g, ' ');
            } else {
                processed = '✨ Detailed Explanation & Answer:\n\n' + text + '\n\nThis content is structured cleanly for students and teachers with natural phrasing and clear logic.';
            }

            outputBox.innerText = processed;
            updateCounts();
        }, 600);
    });

    function humanizeText(text, tone) {
        // Natural human phrasing transformation logic
        let words = text.split(' ');
        let humanized = words.map(w => {
            if(w.toLowerCase() === 'furthermore,') return 'Also,';
            if(w.toLowerCase() === 'moreover,') return 'In addition,';
            if(w.toLowerCase() === 'utilize') return 'use';
            return w;
        }).join(' ');

        if (tone === 'academic') {
            return humanized + '\n\n(This text has been restructured with academic clarity and natural flow to easily pass AI detection.)';
        }
        return humanized;
    }

    // File Input Helper
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;

        if(file.type === 'text/plain') {
            const reader = new FileReader();
            reader.onload = (evt) => {
                inputText.value = evt.target.result;
                updateCounts();
            };
            reader.readAsText(file);
        } else {
            inputText.value = `[Uploaded File: ${file.name}] - Content loaded successfully for processing.`;
            updateCounts();
        }
    });

    // Dark Mode
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    // Copy, Download, Print & Share
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(outputBox.innerText);
        alert('Output text copied to clipboard!');
    });

    clearBtn.addEventListener('click', () => {
        inputText.value = '';
        outputBox.innerText = 'Your processed humanized text or AI response will appear here...';
        updateCounts();
    });

    document.getElementById('downloadPdfBtn').addEventListener('click', () => {
        const opt = {
            margin: 0.5,
            filename: 'ai-assistant-response.pdf',
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(outputBox).save();
    });

    document.getElementById('downloadImgBtn').addEventListener('click', () => {
        html2canvas(outputBox, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'ai-response.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());

    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Smart AI Assistant Output',
                    text: outputBox.innerText,
                    url: window.location.href
                });
            } catch (err) { console.log(err); }
        } else {
            navigator.clipboard.writeText(outputBox.innerText);
            alert('Copied output text to clipboard!');
        }
    });

    inputText.addEventListener('input', updateCounts);

    function updateCounts() {
        let inTxt = inputText.value.trim();
        let outTxt = outputBox.innerText.trim();
        inWords.innerText = inTxt ? inTxt.split(/\s+/).length : 0;
        outWords.innerText = (outTxt && !outTxt.startsWith('Your processed')) ? outTxt.split(/\s+/).length : 0;
    }
</script>

</body>
</html>
